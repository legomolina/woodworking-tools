<label [for]="name()">{{ label() }}</label>
<div>
  <input
    #field
    type="text"
    [id]="name()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    autocomplete="off"
    [value]="value()"
    (input)="value.set(field.value)"
  />
  @if (unit(); as unit) {
    <span [id]="unitId()">{{ unit }}</span>
  }
</div>
@if (hint(); as hint) {
  <p [id]="hintId()">{{ hint }}</p>
}
@if (error(); as error) {
  <p role="alert" [id]="errorId()">{{ error }}</p>
}
