@switch (name()) {
  @case ('arrow-right') {
    <svg lucideArrowRight size="100%"></svg>
  }
  @case ('menu') {
    <svg lucideMenu size="100%"></svg>
  }
  @case ('sliders-horizontal') {
    <svg lucideSlidersHorizontal size="100%"></svg>
  }
  @case ('x') {
    <svg lucideX size="100%"></svg>
  }
}
