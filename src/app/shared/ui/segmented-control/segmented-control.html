<span [id]="labelId()">{{ label() }}</span>
<div
  role="radiogroup"
  [attr.aria-labelledby]="labelId()"
  [attr.aria-describedby]="hint() === undefined ? null : hintId()"
>
  @for (option of options(); track option.value) {
    <label>
      <input
        type="radio"
        [name]="name()"
        [value]="option.value"
        [checked]="option.value === value()"
        (change)="value.set(option.value)"
      />
      {{ option.label }}
    </label>
  }
</div>
@if (hint(); as hint) {
  <p [id]="hintId()">{{ hint }}</p>
}
