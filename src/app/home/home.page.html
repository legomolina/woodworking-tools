<hgroup>
  <h1>{{ 'app.name' | transloco }}</h1>
  <p>{{ 'home.intro' | transloco }}</p>
</hgroup>

@if (tools.length > 0) {
  <ul>
    @for (tool of tools; track tool.path) {
      <li>
        <a [routerLink]="['/', tool.path]">
          <h2>{{ tool.nameKey | transloco }}</h2>
          <p>{{ tool.descriptionKey | transloco }}</p>
          <span>
            {{ 'home.open' | transloco }}
            <wt-icon name="arrow-right" size="sm" />
          </span>
        </a>
      </li>
    }
  </ul>
} @else {
  <p>{{ 'home.noTools' | transloco }}</p>
}
