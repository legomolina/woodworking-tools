# Runs Claude when the owner mentions @claude in an issue, a PR comment or a
# review: it can answer, review again, or implement an issue and open a PR.
# It works like a local session: the project's CLAUDE.md, hooks and checks
# apply, so dependencies are installed first for the hooks and checks to run.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  claude:
    # Only the owner can trigger it: the repo is public, and every run spends
    # the owner's Claude subscription.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on PRs

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Same commands the project allows locally (.claude/settings.json),
          # plus git and gh to branch, commit, push and open the PR.
          claude_args: >-
            --allowedTools
            "Bash(pnpm lint)" "Bash(pnpm lint:fix)" "Bash(pnpm typecheck)"
            "Bash(pnpm test:ci)" "Bash(pnpm test:ci *)" "Bash(pnpm build)"
            "Bash(pnpm i18n:check)" "Bash(pnpm exec ng test *)"
            "Bash(git *)" "Bash(gh issue *)" "Bash(gh pr *)" "Bash(gh run *)"
